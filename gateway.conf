# gateway.conf — identifiants de la passerelle XMR (monero-wallet-rpc).
# Aucun mot de passe n'est codé ici : ce fichier doit être rempli par toi.
#
# Lisez le dans xmr_gateway.py pour le fonctionnement :
#   1) variable d'environnement XMR_GATEWAY_PASS (prioritaire)
#   2) ce fichier (format A ou B ci-dessous)
#   3) saisie interactive
#
# Format A (recommandé) : une seule ligne = le mot de passe du wallet RPC
#   (login par défaut : xmrgw)
# VotreMotDePasseRpc
#
# Format B (si le login n'est pas 'xmrgw') : deux lignes
#   user=xmrgw
#   pass=VotreMotDePasseRpc
#
# NE PARTAGE PAS ce fichier, NE LE PUBLIE PAS.
# La passerelle ne s'occupe que de la lecture / transit de Monero (via Tor).
